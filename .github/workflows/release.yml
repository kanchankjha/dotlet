name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Verify version matches source
        run: |
          SOURCE_VERSION=$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' dotlet/__init__.py)
          if [ "$SOURCE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Error: Tag version (${{ steps.version.outputs.version }}) does not match source version ($SOURCE_VERSION)"
            exit 1
          fi

      - name: Build .deb package (amd64)
        run: |
          VERSION=${{ steps.version.outputs.version }} ARCH=amd64 ./packaging/build-deb.sh

      - name: Build .deb package (arm64)
        run: |
          VERSION=${{ steps.version.outputs.version }} ARCH=arm64 ./packaging/build-deb.sh

      - name: Generate release notes
        id: notes
        run: |
          # Extract notes for this version from CHANGELOG if it exists
          if [ -f CHANGELOG.md ]; then
            # Extract section between this version header and next version header
            awk '/^## \[?${{ steps.version.outputs.version }}\]?/{flag=1; next} /^## \[?[0-9]+\.[0-9]+\.[0-9]+\]?/{flag=0} flag' CHANGELOG.md > release_notes.md
            if [ -s release_notes.md ]; then
              echo "Found release notes in CHANGELOG.md"
            else
              echo "No specific notes found for this version"
              echo "Release ${{ steps.version.outputs.version }}" > release_notes.md
            fi
          else
            echo "Release ${{ steps.version.outputs.version }}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dotlet v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/dotlet_${{ steps.version.outputs.version }}_amd64.deb
            dist/dotlet_${{ steps.version.outputs.version }}_arm64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
